# nginx configuration for tunnel.example.com
#
# Two server blocks, because the two hostnames are two different services:
#
#   tunnel.example.com     the control plane: JSON API, OpenAPI spec, web UI
#   *.tunnel.example.com   tunnels, one subdomain per session
#
# Both proxy to the same Go process on 127.0.0.1:8080, which routes on the Host
# header, but they must not share a block. Any path rule written for the control
# plane (rate limiting /api/v1/connect, a health check on /healthz) would
# otherwise apply to every tunnel too, so a tunneled MCP server that happens to
# expose one of those paths would be rate limited and would lose the upgrade
# headers and long timeouts its traffic needs. nginx prefers an exact
# server_name over a wildcard, so the split below sends each host to the right
# set of rules.
#
# Prerequisites
#   DNS:  A/AAAA  tunnel.example.com    -> this host
#         A/AAAA  *.tunnel.example.com  -> this host
#   TLS:  a wildcard certificate covering both names, e.g.
#         certbot certonly --dns-cloudflare \
#           -d tunnel.example.com -d '*.tunnel.example.com'
#         (a wildcard needs the DNS-01 challenge, http-01 will not issue one)
#
# Install as /etc/nginx/sites-available/tunnel.example.com.conf and symlink into
# sites-enabled, or drop it in /etc/nginx/conf.d/. Replace tunnel.example.com
# throughout with your own hostname:
#
#   sed -i 's/tunnel\.example\.com/your.domain.here/g' tunnel.example.com.conf

# Generic upgrade passthrough. The tunnel uses "Upgrade: https-tunnel" rather than
# websocket, and MCP servers behind it may use websockets of their own, so map
# whatever the client asked for straight through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream https_tunnel_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate limit only the control plane. Tunneled traffic is never throttled here.
limit_req_zone $binary_remote_addr zone=tunnel_control:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tunnel.example.com *.tunnel.example.com;

    # ACME http-01 for the apex, if you use it alongside the DNS-01 wildcard.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Control plane: API, OpenAPI spec and web UI, on the apex hostname only.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tunnel.example.com;

    ssl_certificate     /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;
    proxy_buffering off;
    proxy_request_buffering off;

    access_log /var/log/nginx/https-tunnel.control.access.log;
    error_log  /var/log/nginx/https-tunnel.control.error.log;

    # The tunnel handshake. It upgrades and then stays open for as long as the
    # client runs, so it needs the upgrade headers and no meaningful timeout.
    location = /api/v1/tunnel {
        proxy_pass http://https_tunnel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    1d;
        proxy_read_timeout    1d;
    }

    # Session registration. burst absorbs the reconnect storm after a restart.
    location = /api/v1/connect {
        limit_req zone=tunnel_control burst=20 nodelay;

        proxy_pass http://https_tunnel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://https_tunnel_backend;
        proxy_set_header Host $host;
    }

    # Everything else on the apex: the rest of the API, the OpenAPI document at
    # /openapi.json, and the web UI.
    location / {
        limit_req zone=tunnel_control burst=40 nodelay;

        proxy_pass http://https_tunnel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

# ---------------------------------------------------------------------------
# Tunnels: every other hostname under the base domain. One location and no path
# rules, because these paths belong to whatever the client is serving locally.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.tunnel.example.com;

    ssl_certificate     /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # MCP payloads can be large; 0 disables the limit entirely if you prefer.
    client_max_body_size 64m;

    # Buffer nothing. The tunneled server may stream server-sent events, which
    # have to reach the caller as they are produced.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;

    access_log /var/log/nginx/https-tunnel.tunnel.access.log;
    error_log  /var/log/nginx/https-tunnel.tunnel.error.log;

    location / {
        proxy_pass http://https_tunnel_backend;
        proxy_http_version 1.1;

        # Carries any websocket the tunneled application uses.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The Go process routes on Host, so it must survive untouched.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # A long poll or an idle SSE stream must not be cut short.
        proxy_connect_timeout 10s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
    }
}
