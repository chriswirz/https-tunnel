# The tunnel server sharing a container with nginx, on the Debian based image.
#
# Same stack as ../tunnel-server, which uses nginx:1.27-alpine. This one is here
# because nginx:latest is Debian, and the two differ in ways that bite when a
# Dockerfile written for one is pointed at the other:
#
#   package manager  apt-get, needing update, --no-install-recommends and a
#                    cleanup of /var/lib/apt/lists, rather than apk --no-cache
#   /bin/sh          dash, not busybox ash. Both are POSIX, so the entrypoint
#                    below runs unchanged, but anything bash flavored would not
#   libc             glibc, not musl. The binary is built with CGO_ENABLED=0 and
#                    is static, so it runs on either
#   size             roughly 190 MB against 50 MB for the alpine image
#
# Debian also ships /etc/mime.types, which is why a folder served from a Debian
# container reports .md as text/markdown where an alpine one has no mapping at
# all. The client normalizes that, so a readable file opens in the browser
# either way.
#
#   cp ../../../nginx/tunnel.example.com.conf ./site.conf
#   sed -i 's/tunnel\.example\.com/your.domain.here/g' site.conf
#   printf 'TUNNEL_BASE_DOMAIN=your.domain.here\nTUNNEL_API_KEY=%s\n' "$(openssl rand -hex 24)" > .env
#   docker compose up -d
name: https-tunnel-server-debian

services:
  tunnel:
    build:
      args:
        TUNNEL_RELEASE: ${TUNNEL_RELEASE:-latest}
      dockerfile_inline: |
        # nginx:latest is Debian. Pin the tag in anything you rely on: latest
        # moves under you, and a new nginx major is not a change you want to
        # discover from a restart.
        FROM nginx:latest
        RUN apt-get update \
         && apt-get install -y --no-install-recommends ca-certificates curl \
         && rm -rf /var/lib/apt/lists/*
        ARG TUNNEL_RELEASE=latest
        # Only TUNNEL_RELEASE appears below, and that is deliberate: Docker
        # substitutes every $var on a RUN line before the shell sees it, and any
        # name that is not a build arg becomes an empty string. Shell variables
        # here would silently vanish and curl would be handed an empty URL.
        # The two URL shapes are spelled out because GitHub words them
        # differently: latest/download/<asset> against download/<tag>/<asset>.
        RUN set -eu; \
            if [ -z "${TUNNEL_RELEASE}" ] || [ "${TUNNEL_RELEASE}" = "latest" ]; then \
              curl -fsSL -o /usr/local/bin/https-tunnel \
                "https://github.com/chriswirz/https-tunnel/releases/latest/download/https-tunnel-linux-amd64"; \
            else \
              curl -fsSL -o /usr/local/bin/https-tunnel \
                "https://github.com/chriswirz/https-tunnel/releases/download/${TUNNEL_RELEASE}/https-tunnel-linux-amd64"; \
            fi; \
            chmod +x /usr/local/bin/https-tunnel
        RUN cat > /entrypoint.sh <<'SH' && chmod +x /entrypoint.sh
        #!/bin/sh
        set -eu

        # The server writes the admin password hash back into this file, so it
        # lives on a volume and is only created the first time. Mount your own
        # config over /data/config.json instead if you need several api keys.
        CONFIG=/data/config.json
        if [ ! -f "\$CONFIG" ]; then
          cat > "\$CONFIG" <<JSON
        {
          "server": {
            "addr": "127.0.0.1",
            "port": 8080,
            "base_domain": "\${TUNNEL_BASE_DOMAIN}",
            "public_scheme": "https",
            "trust_forwarded_headers": true,
            "api_keys": [{ "name": "default", "key": "\${TUNNEL_API_KEY}" }],
            "state_file": "/data/sessions.json",
            "session_ttl_hours": 720
          }
        }
        JSON
        fi

        https-tunnel --config "\$CONFIG" server &
        tunnel=\$!

        nginx -g 'daemon off;' &
        web=\$!

        # Stop both if either one stops. Neither is any use on its own, and
        # exiting lets the restart policy bring up a clean pair.
        trap 'kill -TERM "\$tunnel" "\$web" 2>/dev/null || true' INT TERM
        while kill -0 "\$tunnel" 2>/dev/null && kill -0 "\$web" 2>/dev/null; do
          sleep 5
        done
        kill -TERM "\$tunnel" "\$web" 2>/dev/null || true
        wait || true
        exit 1
        SH

        # A compose file checked out with CRLF line endings would otherwise hand
        # the container a script whose lines end in a carriage return, which
        # no shell can parse. Stripping trailing whitespace removes them.
        RUN sed -i "s/[[:space:]]*\$//" /entrypoint.sh
        ENTRYPOINT ["/entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TUNNEL_BASE_DOMAIN: ${TUNNEL_BASE_DOMAIN:?set TUNNEL_BASE_DOMAIN in .env}
      TUNNEL_API_KEY: ${TUNNEL_API_KEY:?set TUNNEL_API_KEY in .env}
    volumes:
      # The site file from nginx/ in this repository, with the domain replaced.
      # conf.d is included inside nginx's http block, which is where the map,
      # upstream and limit_req_zone directives at the top of that file belong.
      - ./site.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificates stay on the host, where certbot renews them.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # config.json, with the admin password hash, and the session table.
      - tunnel-state:/data
    healthcheck:
      # Goes through nginx on the apex, so it covers both halves of the container.
      test: ["CMD", "curl", "-fsS", "-H", "Host: ${TUNNEL_BASE_DOMAIN}", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tunnel-state:
